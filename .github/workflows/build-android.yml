name: Oudi Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned upstream data required by the build
        run: |
          git clone https://github.com/Gathin23/cleanyourtv.git third_party/cleanyourtv
          git -C third_party/cleanyourtv checkout b06ab21105c49900cb1ed76b24414dba1e21d0db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleFullDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oudi-Home-Tv-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
