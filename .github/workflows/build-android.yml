name: Oudi Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned upstream data required by the build
        run: |
          git clone https://github.com/Gathin23/cleanyourtv.git third_party/cleanyourtv
          git -C third_party/cleanyourtv checkout b06ab21105c49900cb1ed76b24414dba1e21d0db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Oudi manager APK
        run: ./gradlew --no-daemon :app:assembleFullDebug
      - name: Build Oudi TV home launcher
        working-directory: third_party/cleanyourtv/launcher
        run: |
          sed -i 's#<string name="app_name">Home</string>#<string name="app_name">Oudi Home TV</string>#' app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">الرئيسية</string>#<string name="app_name">Oudi Home TV</string>#' app/src/main/res/values-ar/strings.xml
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PlauncherApplicationId=com.oudi.hometv
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/Oudi-Home-TV-Launcher.apk"
      - name: Upload Oudi manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Oudi-Home-Tv-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Oudi TV launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Oudi-Home-TV-Launcher
          path: out/Oudi-Home-TV-Launcher.apk
          if-no-files-found: error
          retention-days: 14
